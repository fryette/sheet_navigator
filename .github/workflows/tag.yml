name: Tag

on:
  push:
    branches: [main]

concurrency:
  group: tag-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create next patch tag
        run: |
          if git tag --points-at "$GITHUB_SHA" | grep -q '^v[0-9]'; then
            exit 0
          fi
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"
          git tag "$next" "$GITHUB_SHA"
          git push origin "$next"
